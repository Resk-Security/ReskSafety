[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resk-app"
version = "0.1.0"
description = "ReskSafety - Deployable LLM firewall application with RBAC, policies and admin console"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "RESK Team" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "email-validator>=2.0",
    "pyjwt[crypto]>=2.8",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Optional local integration. Install separately:
#   pip install -e ../../resk-logits
#   pip install -e ../../Resk-LLM
# When absent, the firewall falls back to naive post-filtering.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resk_app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
