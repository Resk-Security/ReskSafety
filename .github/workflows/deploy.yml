name: CI/CD

on:
  push:
    branches: [main, demo]
  workflow_dispatch:

env:
  VPS_DEPLOY_PATH: ~/sites/resk-firewall
  COMPOSE_FILE: docker-compose.demo.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: resk-firewall-demo:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/demo'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ env.VPS_DEPLOY_PATH }}
            cd ${{ env.VPS_DEPLOY_PATH }}
            git fetch origin && git reset --hard origin/${{ github.ref_name }}
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --build
            docker image prune -f
