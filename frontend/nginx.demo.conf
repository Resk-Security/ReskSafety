server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API — accessible only from same-origin (frontend)
    # none: allows OPTIONS preflight (no Referer header)
    # ~resk\.fr: matches resk.fr, www.resk.fr, demo.resk.fr, etc.
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        valid_referers none server_names ~resk\.fr ~^https?://localhost;
        if ($invalid_referer) {
            return 403;
        }
        proxy_pass http://backend:8000;
    }

    # v1/ LLM endpoint — same origin check
    location /v1/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        valid_referers none server_names ~resk\.fr ~^https?://localhost;
        if ($invalid_referer) {
            return 403;
        }
        proxy_pass http://backend:8000;
    }

    # Frontend static files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
